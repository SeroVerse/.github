# SeroVerse/.github/.github/workflows/docs.yml
name: Shared Zensical Docs Deployment

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.13"
      site-dir:
        required: false
        type: string
        default: "site"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Allows hatch-vcs to resolve version if docs inspect package metadata

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ inputs.python-version }}

      - name: Install project and docs dependencies
        run: uv sync --locked --group docs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Zensical site
        run: uv run zensical build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.site-dir }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
